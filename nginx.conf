# Redirigir todo el trafico HTTP a HTTPS
server {
    listen 80;
    server_name _;

    # Para validacion de Let's Encrypt (http-01) antes del salto
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Igual al MAX_CONTENT_LENGTH de Flask
    client_max_body_size 16m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor TLS principal.
# Certificados: montar en ./ssl (docker-compose ya monta ./ssl:/etc/nginx/ssl).
#   - Let's Encrypt: fullchain.pem y privkey.pem
#   - Renovacion: certbot renew --deploy-hook "docker restart condo_services_nginx"
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Igual al MAX_CONTENT_LENGTH de Flask para que las subidas no fallen
    client_max_body_size 16m;

    # Cabeceras de seguridad (HSTS solo tiene sentido con TLS activo)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://condo_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
