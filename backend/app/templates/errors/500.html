{% extends "base.html" %}

{% block title %}Error interno - Condo Services 360{% endblock %}

{% block content %}
<section style="min-height: 70vh; display: flex; align-items: center; padding: calc(var(--header-height) + var(--spacing-xl)) 0 var(--spacing-xl);">
    <div class="container" style="text-align: center;">
        <div style="max-width: 560px; margin: 0 auto;">
            <div style="font-size: 6rem; font-family: var(--font-heading); font-weight: 800; color: var(--danger);">500</div>
            <h1>Error interno del servidor</h1>
            <p style="color: var(--neutral-600); font-size: 1.15rem; margin-bottom: var(--spacing-lg);">
              Algo salió mal de nuestra parte. Ya estamos trabajando para solucionarlo.
              Por favor intenta nuevamente en unos minutos.
            </p>
            <a href="{{ url_for('public.index') }}" class="btn-hero-primary">
                <i class="fas fa-home"></i> Volver al Inicio
            </a>
        </div>
    </div>
</section>
{% endblock %}
