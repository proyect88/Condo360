<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión - Condo Services 360</title>
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .offline-card {
            text-align: center;
            background: white;
            padding: 48px 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 420px;
        }
        .offline-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #e3eef7;
            color: #1a365d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 24px;
        }
        h1 { color: #1a365d; font-size: 1.5rem; margin-bottom: 8px; }
        p { color: #6b7280; line-height: 1.6; }
        button {
            background: #1a365d;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">!</div>
        <h1>Sin conexi&oacute;n</h1>
        <p>No hay conexi&oacute;n a internet en este momento.<br>
        Revisa tu red e intenta nuevamente.</p>
        <button onclick="window.location.reload()">Reintentar</button>
    </div>
</body>
</html>
